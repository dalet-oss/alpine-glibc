name: 'Publish releases'

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-releases.yml
      # Output of the package-apks workflow. Either architecture may be merged first, so watch both;
      # the run triggered by whichever lands last picks up the architecture that was skipped earlier.
      - apk/amd64/*/*.apk
      - apk/arm64/*/*.apk

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: false


jobs:

  discover-unreleased-versions:
    runs-on: ubuntu-latest
    outputs:
      unreleased_versions_json: ${{ steps.discover-versions.outputs.unreleased_versions_json }}
    steps:
      - uses: actions/checkout@v7

      - name: Discover versions
        id: discover-versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSIONS=$(cat glibc-versions.yml | yq '.versions[].glibcVersion')
          UNRELEASED_VERSIONS=''
          for VERSION in ${VERSIONS[@]}; do
            for TARGETARCH in amd64 arm64; do
              if gh release view "${VERSION}-${TARGETARCH}" &>/dev/null; then
                echo "*** Release ${VERSION}-${TARGETARCH} already exists - nothing to do here."
                continue
              fi
              # A release must never be published before its APKs have been merged, so only consider a
              # version releasable once all 4 of its packages (glibc, glibc-bin, glibc-dev, glibc-i18n)
              # are present for this architecture.
              APK_COUNT=$(ls apk/${TARGETARCH}/${VERSION}/glibc*-${VERSION}.apk 2>/dev/null | wc -l | tr -d "[:space:]")
              if [ "${APK_COUNT}" -eq 4 ]; then
                echo "*** Release ${VERSION}-${TARGETARCH} does not exist, and all 4 APKs are present; it will be created"
                UNRELEASED_VERSIONS="${UNRELEASED_VERSIONS} ${VERSION}-${TARGETARCH}"
              elif [ "${APK_COUNT}" -eq 0 ]; then
                echo "*** Release ${VERSION}-${TARGETARCH} does not exist, but its APKs have not been packaged yet - skipping."
              else
                echo "::error::${VERSION}-${TARGETARCH} has ${APK_COUNT} APKs, but expected either 4 (packaged) or 0 (not yet packaged). The package-apks workflow has probably only partially completed."
                exit 1
              fi
            done
          done
          UNRELEASED_VERSIONS_JSON=$(echo ${UNRELEASED_VERSIONS} | jq  -Rc 'split(" ")')
          echo unreleased_versions_json=${UNRELEASED_VERSIONS_JSON} >> ${GITHUB_OUTPUT}


  publish-new-releases:
    needs: discover-unreleased-versions
    if: needs.discover-unreleased-versions.outputs.unreleased_versions_json != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # avoid parallelising, just to ensure ordering
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.discover-unreleased-versions.outputs.unreleased_versions_json) }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set env vars
        run: |
          echo "VERSION=$(echo ${{ matrix.version }} | cut -d'-' -f1)" >> ${GITHUB_ENV}
          echo "TARGETARCH=$(echo ${{ matrix.version }} | cut -d'-' -f2)" >> ${GITHUB_ENV}

      # APKs are stored in Git LFS; if the LFS checkout above silently degrades, the files on disk are
      # 132-byte pointer stubs rather than packages, and uploading those would produce a release which
      # looks healthy but is unusable. APKs are gzip streams, so gzip -t tells the two apart.
      - name: Verify the APKs are valid archives, not Git LFS pointers
        run: |
          for APK in apk/${TARGETARCH}/${VERSION}/glibc*-${VERSION}.apk; do
            if gzip -t "${APK}"; then
              echo "*** ${APK} is a valid archive"
            else
              echo "::error::${APK} is not a valid archive - the Git LFS checkout has probably failed"
              exit 1
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ matrix.version }}"
          name: "${{ env.VERSION }} (${{ env.TARGETARCH }})"
          body: |
            Version ${{ env.VERSION }} of the GNU C library, glibc, built for Alpine with ${{ env.TARGETARCH }} CPU architecture.
          files: |
            apk/${{ env.TARGETARCH }}/${{ env.VERSION }}/glibc*-${{ env.VERSION }}.apk
          # Backstop for the APK presence check in the discover-unreleased-versions job: never allow a
          # release to be published with no assets attached.
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
